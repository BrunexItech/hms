# Drop this in as a NEW file on the VPS — it does not touch any existing
# server block for oqtekal.com, ischool.oqtekal.com, or anything else.
#
#   sudo cp nginx/hms.oqtekal.com.conf /etc/nginx/sites-available/hms.oqtekal.com.conf
#   sudo ln -s /etc/nginx/sites-available/hms.oqtekal.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t   # check for conflicts BEFORE reloading
#   sudo systemctl reload nginx
#
# Reuses the existing wildcard (*.oqtekal.com) Cloudflare Origin Certificate —
# no separate cert needed for this subdomain.

server {
    listen 80;
    server_name hms.oqtekal.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name hms.oqtekal.com;

    ssl_certificate     /etc/ssl/cloudflare/oqtekal.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/oqtekal.com.key;

    client_max_body_size 10M;

    # API — path is forwarded UNCHANGED (not stripped): the FastAPI app
    # itself expects /api/v1/... internally, unlike ischool's backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else — the Next.js frontend.
    location / {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
